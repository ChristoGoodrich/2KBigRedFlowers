name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests and guards
        run: npm test

  core:
    name: native core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        # The toolchain shipped on the runner image; no extra action needed for
        # a crate with no pinned toolchain file.
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-core/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting and lints
        run: cargo fmt --manifest-path rust-core/Cargo.toml --all -- --check
          && cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: Run core tests
        run: cargo test --manifest-path rust-core/Cargo.toml
